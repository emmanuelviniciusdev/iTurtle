# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: iTurtle

before:
  hooks:
    - go mod verify

builds:
  - id: iturtle
    main: ./cmd/iturtle-smart-fetcher
    binary: iTurtle
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm64

archives:
  - id: posix
    ids:
      - iturtle
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats: [none]
    files:
      - README.md
      - LICENSE
      - src: packaging/install-notes.txt
        dst: INSTALL.txt

  - id: windows
    ids:
      - iturtle
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - zip
    format_overrides:
      - goos: linux
        formats: [none]
      - goos: darwin
        formats: [none]
    files:
      - README.md
      - LICENSE
      - src: packaging/install-notes.txt
        dst: INSTALL.txt

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  name_template: "iTurtle {{ .Tag }}"
  draft: false
  prerelease: auto
  footer: |
    ---

    ## Install

    The installer downloads this release's binary and installs **ffmpeg**, **yt-dlp**, and **Deno** if they are missing.

    **macOS / Linux**
    ```bash
    curl -fsSL https://raw.githubusercontent.com/emmanuelviniciusdev/iTurtle/main/scripts/install.sh | bash
    ```

    **Windows** (PowerShell)
    ```powershell
    irm https://raw.githubusercontent.com/emmanuelviniciusdev/iTurtle/main/scripts/install.ps1 | iex
    ```

    Then run:
    ```bash
    iTurtle download -url "https://youtube.com/watch?v=VIDEO_ID" -out ./music
    iTurtle version
    ```

    Archives for Linux, macOS, and Windows are attached to this release.

snapshot:
  version_template: "{{ incpatch .Version }}-next"

source:
  enabled: false
